name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm ci
      - name: Build both frontends
        run: npm run build:claude && npm run build:codex
      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Scan source for common secrets
        shell: bash
        run: |
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=target \
            --exclude='package-lock.json' \
            '(sk-[A-Za-z0-9_-]{16,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|password[[:space:]]*[:=][[:space:]]*[^[:space:]]+)' .; then
            echo "Potential secret found"
            exit 1
          fi
      - name: Build macOS installers
        if: runner.os == 'macOS'
        run: npm run desktop:build:macos
      - name: Build Windows installers
        if: runner.os == 'Windows'
        run: npm run desktop:build:windows
      - name: Upload macOS developer beta
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: friend-agent-macos
          path: release/macos/
      - name: Upload Windows developer beta
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: friend-agent-windows
          path: release/windows/
