[package]
name = "friend-agent-launcher"
version = "0.1.0"
description = "One-click launcher for official Claude and Codex desktop agents"
authors = ["Friend Agent contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "friend_agent_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
keyring = "4.1.5"
open = "5.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
toml_edit = "0.22"
